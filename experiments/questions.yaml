  answer: No, mobile phone use is prohibited in the library; the ID card is the library card and must be scanned at the gate.
  pages: [21, 22, 90]
  keywords: [["id card", "identity card"], ["prohibit", "not allowed", "switched off", "switched-off", "cannot", "not permitted"]]

